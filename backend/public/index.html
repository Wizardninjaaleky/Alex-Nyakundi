<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Portfolio Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1f2937;
            --light: #f3f4f6;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--light);
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: var(--white);
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }

        .login-box h2 {
            margin-bottom: 2rem;
            color: var(--dark);
            text-align: center;
        }

        .admin-container {
            display: none;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .admin-container.active {
            display: block;
        }

        .admin-header {
            background: var(--white);
            padding: 1.5rem 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            color: var(--dark);
            font-size: 1.75rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-success {
            background: var(--success);
            color: var(--white);
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-danger {
            background: var(--danger);
            color: var(--white);
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-logout {
            background: var(--dark);
            color: var(--white);
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 1rem 2rem;
            background: var(--white);
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--dark);
            transition: all 0.3s;
        }

        .tab-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .tab-btn.active {
            background: var(--primary);
            color: var(--white);
        }

        .tab-content {
            display: none;
            background: var(--white);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--dark);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .portfolio-card {
            background: var(--light);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .portfolio-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .portfolio-card-body {
            padding: 1.5rem;
        }

        .portfolio-card h3 {
            margin-bottom: 0.5rem;
            color: var(--dark);
        }

        .portfolio-card p {
            color: #6b7280;
            margin-bottom: 1rem;
        }

        .portfolio-actions {
            display: flex;
            gap: 0.5rem;
        }

        .alert {
            padding: 1rem 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid var(--success);
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid var(--danger);
        }

        .upload-area {
            border: 2px dashed #d1d5db;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: #f9fafb;
        }

        .upload-area.dragover {
            border-color: var(--primary);
            background: #eff6ff;
        }

        .preview-image {
            max-width: 200px;
            max-height: 200px;
            margin-top: 1rem;
            border-radius: 8px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }

            .portfolio-grid {
                grid-template-columns: 1fr;
            }

            .admin-header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- Login Form -->
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <h2><i class="fas fa-lock"></i> Admin Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            <div id="loginError" class="alert alert-error" style="margin-top: 1rem;"></div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-container" id="adminContainer">
        <div class="admin-header">
            <h1><i class="fas fa-tachometer-alt"></i> Portfolio Admin Panel</h1>
            <button class="btn btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>

        <div id="alertBox" class="alert"></div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('profile')">
                <i class="fas fa-user"></i> Profile
            </button>
            <button class="tab-btn" onclick="switchTab('portfolio')">
                <i class="fas fa-briefcase"></i> Portfolio
            </button>
            <button class="tab-btn" onclick="switchTab('upload')">
                <i class="fas fa-upload"></i> Upload Images
            </button>
        </div>

        <!-- Profile Tab -->
        <div id="profileTab" class="tab-content active">
            <h2>Update Profile Information</h2>
            <form id="profileForm">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="profileName" required>
                </div>
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="profileTitle" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="profileEmail" required>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" id="profilePhone" required>
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="profileLocation" required>
                    </div>
                </div>
                <h3 style="margin: 2rem 0 1rem;">Social Links</h3>
                <div class="grid-2">
                    <div class="form-group">
                        <label>LinkedIn</label>
                        <input type="url" id="socialLinkedin">
                    </div>
                    <div class="form-group">
                        <label>GitHub</label>
                        <input type="url" id="socialGithub">
                    </div>
                    <div class="form-group">
                        <label>Instagram</label>
                        <input type="url" id="socialInstagram">
                    </div>
                    <div class="form-group">
                        <label>YouTube</label>
                        <input type="url" id="socialYoutube">
                    </div>
                </div>
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-save"></i> Save Profile
                </button>
            </form>
        </div>

        <!-- Portfolio Tab -->
        <div id="portfolioTab" class="tab-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2>Manage Portfolio Items</h2>
                <button class="btn btn-primary" onclick="showAddPortfolioForm()">
                    <i class="fas fa-plus"></i> Add New Item
                </button>
            </div>

            <div id="addPortfolioForm" style="display: none; margin-bottom: 2rem; padding: 2rem; background: var(--light); border-radius: 12px;">
                <h3>Add Portfolio Item</h3>
                <form id="portfolioForm">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="portfolioTitle" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="portfolioDescription" rows="3" required></textarea>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Category</label>
                            <select id="portfolioCategory" required>
                                <option value="development">Development</option>
                                <option value="photography">Photography</option>
                                <option value="videography">Videography</option>
                                <option value="editing">Video Editing</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Tag</label>
                            <input type="text" id="portfolioTag" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Image URL (upload image first in Upload tab)</label>
                        <input type="text" id="portfolioImage" placeholder="/uploads/filename.jpg" required>
                    </div>
                    <div style="display: flex; gap: 1rem;">
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-plus"></i> Add Item
                        </button>
                        <button type="button" class="btn btn-danger" onclick="hideAddPortfolioForm()">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>

            <div id="portfolioGrid" class="portfolio-grid"></div>
        </div>

        <!-- Upload Tab -->
        <div id="uploadTab" class="tab-content">
            <h2>Upload Images</h2>
            <p style="color: #6b7280; margin-bottom: 2rem;">Upload images for your portfolio items. Maximum file size: 5MB</p>
            
            <div class="upload-area" id="uploadArea">
                <i class="fas fa-cloud-upload-alt" style="font-size: 3rem; color: var(--primary); margin-bottom: 1rem;"></i>
                <p style="font-size: 1.1rem; margin-bottom: 0.5rem;">Drag & drop an image here or click to browse</p>
                <p style="color: #6b7280; font-size: 0.9rem;">Supported formats: JPG, PNG, GIF, WebP</p>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
            </div>

            <div id="uploadPreview" style="margin-top: 2rem; text-align: center; display: none;">
                <img id="previewImage" class="preview-image">
                <p id="uploadedUrl" style="margin-top: 1rem; padding: 1rem; background: var(--light); border-radius: 8px; font-family: monospace;"></p>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
